<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Business Office · Pomfret</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600&family=Barlow:wght@400;600&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>/*KIT_CSS*/
.multiples { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px 22px; }
.multiples h4 { font: 600 14px var(--cond); letter-spacing: .06em; margin: 0 0 2px; }
.multiples h4 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script>/*KIT_JS*/</script>
<script>
// ============================================================ 1. SETTINGS
const CONFIG = {
  kicker: "Business Office",
  title: "Cash flow",
  subtitle: "Where the money comes from, where it goes, and when cash runs lowest. Monthly actuals, with the rest of this fiscal year as forecast.",
  asOf: "2026-11-16",
  source: "business_office_monthly_cash.csv",
  sheet: "Business Office",
  minimumCash: 2000000,             // the cushion the board wants on hand; change to match policy
  columns: ["fiscal_year", "month", "actual_or_forecast", "flow", "category", "line_item", "amount"],
  footnote: "Sample data: all amounts are invented and rounded. Financial aid is shown as a tuition discount, not as cash out.",
};

// ============================================================ 2. DATA
const CSV_DATA = /*DATA:business_office_monthly_cash.csv*/"";
async function loadData() {
  return PD.parseCSV(CSV_DATA);
}

// ============================================================ 3. RENDER
const FM = ["Jul", "Aug", "Sep", "Oct", "Nov", "Dec", "Jan", "Feb", "Mar", "Apr", "May", "Jun"];
function render(rows) {
  const R = PD.objects(rows).map((r) => ({ ...r, amt: PD.num(r.amount), d: PD.date(r.month), fc: /fore/i.test(r.actual_or_forecast) }));
  const fys = PD.uniq(R.filter((r) => /in|out/i.test(r.flow)).map((r) => r.fiscal_year)).sort();
  const curFY = fys[fys.length - 1], lastFY = fys[fys.length - 2];
  const fmIdx = (d) => (d.getMonth() + 6) % 12;               // Jul = 0
  const signed = (r) => (/^out/i.test(r.flow) ? -r.amt : /^in/i.test(r.flow) ? r.amt : 0);
  const opening = PD.sum(R.filter((r) => /open/i.test(r.flow)), (r) => r.amt);

  // monthly net + running balance across all years
  const months = [...PD.group(R.filter((r) => /in|out/i.test(r.flow)), (r) => r.month)].sort((a, b) => (a[0] < b[0] ? -1 : 1));
  let bal = opening;
  const M = months.map(([m, rs]) => {
    const inflow = PD.sum(rs.filter((r) => /^in/i.test(r.flow)), (r) => r.amt), outflow = PD.sum(rs.filter((r) => /^out/i.test(r.flow)), (r) => r.amt);
    bal += inflow - outflow;
    return { m, d: PD.date(m), fy: rs[0].fiscal_year, fc: rs.every((r) => r.fc), inflow, outflow, net: inflow - outflow, bal };
  });
  const lastActual = M.filter((x) => !x.fc).pop();
  const fyM = (fy) => M.filter((x) => x.fy === fy);
  const cur = fyM(curFY), low = cur.reduce((a, b) => (b.bal < a.bal ? b : a));
  const lastYearOut = PD.sum(fyM(lastFY), (x) => x.outflow);
  const ytd = (fy) => PD.sum(fyM(fy).filter((x) => fmIdx(x.d) <= fmIdx(lastActual.d)), (x) => x.net);
  const fyRows = (fy) => R.filter((r) => r.fiscal_year === fy && /in|out/i.test(r.flow));
  const gross = (fy) => PD.sum(fyRows(fy).filter((r) => /tuition/i.test(r.category) && r.amt > 0), (r) => r.amt);
  const aid = (fy) => -PD.sum(fyRows(fy).filter((r) => /tuition/i.test(r.category) && r.amt < 0), (r) => r.amt);

  const { kpis, grid } = PD.page(CONFIG);
  PD.kpis(kpis, [
    { label: `Cash at end of ${PD.fmt.monthY(lastActual.d)}`, value: PD.fmt.money(lastActual.bal), detail: `${Math.round(lastActual.bal / (lastYearOut / 365))} days of operating cash`, spark: M.filter((x) => !x.fc).slice(-16).map((x) => x.bal) },
    { label: `${curFY} net cash, year to date`, value: PD.fmt.money(ytd(curFY)), delta: ytd(curFY) - ytd(lastFY), deltaText: PD.fmt.money(ytd(curFY) - ytd(lastFY)), detail: `vs. ${lastFY} same months` },
    { label: "Projected low point", value: PD.fmt.money(low.bal), detail: `${PD.fmt.monthY(low.d)}${low.bal < CONFIG.minimumCash ? " · below the " + PD.fmt.money(CONFIG.minimumCash) + " minimum" : ""}`, hot: low.bal < CONFIG.minimumCash * 1.3 },
    { label: `${curFY} full year, forecast`, value: PD.fmt.money(PD.sum(cur, (x) => x.net)), detail: "inflows minus outflows", goodWhenUp: true },
    { label: `Discount rate, ${lastFY}`, value: PD.fmt.pct(aid(lastFY) / gross(lastFY), 1), detail: `${PD.fmt.money(aid(lastFY))} aid on ${PD.fmt.money(gross(lastFY))} tuition` },
  ]);

  // ---- balance
  PD.card(grid, { title: "Cash on hand, month by month", note: `Month-end balance on a July–June year. <b style="color:var(--red)">${curFY}</b> is solid through ${PD.fmt.monthY(lastActual.d)} and dashed where it is forecast. Gray lines are earlier years. The dotted line is the board minimum.`, span: 8 }, (el) => {
    const series = fys.map((fy) => {
      const pts = fyM(fy).map((x) => [fmIdx(x.d), x.bal]);
      if (fy !== curFY) return { name: fy, points: pts, color: fy === lastFY ? "var(--ink-2)" : "var(--context)", width: 1.3 };
      return null;
    }).filter(Boolean);
    const act = cur.filter((x) => !x.fc).map((x) => [fmIdx(x.d), x.bal]);
    const fc = cur.filter((x) => x.fc).map((x) => [fmIdx(x.d), x.bal]);
    series.push({ name: curFY + " forecast", points: [act[act.length - 1], ...fc], color: "var(--red)", dash: "5,4", width: 2, strong: true });
    series.push({ name: curFY, points: act, color: "var(--red)", width: 2.6, label: false });
    series.push({ name: "Minimum", points: [[0, CONFIG.minimumCash], [11, CONFIG.minimumCash]], color: "var(--silver)", dash: "2,3", width: 1, endDot: false, tip: false });
    PD.line(el, { series, height: 300, yFmt: PD.fmt.money, xTicks: FM.map((l, i) => ({ v: i, label: l })), tipX: (v) => FM[v] });
  });
  PD.card(grid, { title: `In and out, ${curFY}`, note: "Inflows above the line, outflows below. Lighter bars are forecast. Tuition arrives in two lumps (July and December), while payroll goes out every month.", span: 4 }, (el) => {
    PD.columns(el, { categories: FM, height: 300, yFmt: PD.fmt.money, series: [
      { name: "In", values: FM.map((_, i) => (cur[i] ? cur[i].inflow : 0)), color: (i) => (cur[i] && cur[i].fc ? "var(--context-2)" : "var(--ink-2)") },
      { name: "Out", values: FM.map((_, i) => (cur[i] ? -cur[i].outflow : 0)), color: (i) => (cur[i] && cur[i].fc ? "var(--red-soft)" : "var(--red)") },
    ] });
  });

  // ---- sankey
  PD.section(grid, "<b>Flow</b> · where a year's money comes from and where it goes");
  PD.card(grid, { title: "Sources and uses of cash", note: "Ribbon width is dollars. Gross tuition splits into the aid we give back and the cash we keep. Pick a year. The current year is actuals plus forecast.", span: 12 }, (el, ctl) => {
    PD.seg(ctl, "sankeyFY", fys, lastFY);
    const rs = fyRows(PD.ui.sankeyFY);
    const sumBy = (pred) => [...PD.group(rs.filter(pred), "category")].map(([k, v]) => [k, PD.sum(v, (r) => r.amt)]);
    const ins = sumBy((r) => /^in/i.test(r.flow) && !/tuition/i.test(r.category)).sort((a, b) => b[1] - a[1]);
    const outs = sumBy((r) => /^out/i.test(r.flow)).sort((a, b) => b[1] - a[1]);
    const g = gross(PD.ui.sankeyFY), a = aid(PD.ui.sankeyFY), net = g - a;
    const totalIn = net + PD.sum(ins, (x) => x[1]), totalOut = PD.sum(outs, (x) => x[1]);
    const nodes = [{ id: "gross", label: "Gross tuition & fees", col: 0, color: "var(--ink)" }], links = [];
    ins.forEach(([k]) => nodes.push({ id: "in:" + k, label: k, col: 0, color: "var(--ink-2)" }));
    if (totalOut > totalIn) { nodes.push({ id: "draw", label: "Drawn from cash", col: 0, color: "var(--red)" }); links.push({ source: "draw", target: "ops", value: totalOut - totalIn, color: "var(--red)", opacity: 0.45 }); }
    nodes.push({ id: "aid", label: "Financial aid", col: 1, color: "var(--red)" }, { id: "ops", label: "Operating cash", col: 1, color: "var(--ink)" });
    outs.forEach(([k]) => nodes.push({ id: "out:" + k, label: k, col: 2, color: "var(--ink-2)" }));
    if (totalIn > totalOut) { nodes.push({ id: "save", label: "Added to cash", col: 2, color: "var(--good)" }); links.push({ source: "ops", target: "save", value: totalIn - totalOut, color: "var(--good)", opacity: 0.4 }); }
    links.push({ source: "gross", target: "aid", value: a, color: "var(--red)", opacity: 0.45 }, { source: "gross", target: "ops", value: net });
    ins.forEach(([k, v]) => links.push({ source: "in:" + k, target: "ops", value: v }));
    outs.forEach(([k, v]) => links.push({ source: "ops", target: "out:" + k, value: v }));
    PD.sankey(el, { nodes, links, height: Math.max(360, Math.min(480, el.clientWidth * 0.42)), gap: 9 });
  });

  // ---- small multiples
  PD.section(grid, `<b>Spending</b> · each category, ${curFY} vs. ${lastFY}`);
  PD.card(grid, { title: "Monthly outflows by category", note: `<b style="color:var(--red)">${curFY}</b> (dashed where forecast) against <b>${lastFY}</b> in gray. Every panel has its own scale, so read the shape and compare the totals in each heading.`, span: 12 }, (el) => {
    const box = el.appendChild(PD.el("div", { class: "multiples" }));
    const cats = [...PD.group(R.filter((r) => /^out/i.test(r.flow) && r.fiscal_year === curFY), "category")].map(([k, v]) => [k, PD.sum(v, (r) => r.amt)]).sort((a, b) => b[1] - a[1]);
    cats.forEach(([cat, tot]) => {
      const byM = (fy) => { const a = Array(12).fill(0); R.filter((r) => r.fiscal_year === fy && r.category === cat && /^out/i.test(r.flow)).forEach((r) => (a[fmIdx(r.d)] += r.amt)); return a; };
      const c = byM(curFY), p = byM(lastFY), totP = PD.sum(p), ch = tot / totP - 1;
      const cell = box.appendChild(PD.el("div"));
      cell.innerHTML = `<h4>${PD.esc(cat)}<small>${PD.fmt.money(tot)} · <span class="${Math.abs(ch) > 0.1 ? "lbl-red" : ""}" style="${Math.abs(ch) > 0.1 ? "color:var(--red);font-weight:600" : ""}">${PD.fmt.signed(ch)}</span></small></h4>`;
      const ch1 = cell.appendChild(PD.el("div"));
      const nAct = cur.filter((x) => !x.fc).length;
      PD.line(ch1, { height: 96, noEndLabels: true, yAxisWidth: 40, yFmt: PD.fmt.money, yTicks: 2, xTicks: [{ v: 0, label: "Jul" }, { v: 5, label: "Dec" }, { v: 11, label: "Jun" }], tipX: (v) => FM[v], series: [
        { name: lastFY, points: p.map((v, i) => [i, v]), color: "var(--context)", width: 1.2, endDot: false },
        { name: curFY + " forecast", points: c.slice(nAct - 1).map((v, i) => [i + nAct - 1, v]), color: "var(--red)", dash: "3,3", width: 1.4, endDot: false },
        { name: curFY, points: c.slice(0, nAct).map((v, i) => [i, v]), color: "var(--red)", width: 1.8 },
      ] });
    });
  });
}

PD.start(CONFIG, loadData, render);
</script>
</body>
</html>
